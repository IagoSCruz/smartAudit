[project]
name = "smartaudit"
version = "0.1.0"
description = "SaaS multi-tenant para conciliação e auditoria de fretes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6",
    "defusedxml>=0.7.1",
    "django>=6.1.1",
    "django-ninja>=1.4",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "redis>=6.0",
]

[project.scripts]
smartaudit = "smartaudit:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "smartaudit.settings.local"
pythonpath = ["src"]
testpaths = ["src"]
